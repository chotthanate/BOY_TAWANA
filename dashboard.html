<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>แดชบอร์ดรายรับรายจ่าย | ร้านน้ำ ทาวน่า 2569</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23082847"/><text x="32" y="40" text-anchor="middle" font-size="24" font-family="Arial" fill="white">น้ำ</text></svg>' />
    <link rel="stylesheet" href="dashboard-src/styles.css" />
    <style>
      .app-switcher-toggle {
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: 14px;
        z-index: 10032;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: #ffffff;
        color: #0aa39a;
        box-shadow: 0 8px 24px rgba(20, 40, 30, 0.16);
        font-size: 1.45rem;
        font-weight: 900;
        cursor: pointer;
      }

      .app-switcher-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.18);
        z-index: 10030;
      }

      .app-switcher-panel {
        position: fixed;
        top: calc(max(14px, env(safe-area-inset-top)) + 54px);
        left: 14px;
        width: min(280px, calc(100vw - 28px));
        background: #ffffff;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        box-shadow: 0 12px 34px rgba(16, 24, 40, 0.16);
        padding: 10px;
        z-index: 10031;
      }

      .app-switcher-title {
        padding: 8px 10px 10px;
        color: #667085;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .app-switcher-panel a {
        display: block;
        padding: 12px 14px;
        border-radius: 7px;
        color: #152033;
        text-decoration: none;
        font-weight: 800;
      }

      .app-switcher-panel a.active {
        background: #e6f7f5;
        color: #087d77;
      }

      .app-switcher-panel a + a { margin-top: 4px; }
      .app-switcher-hidden { display: none !important; }
    </style>
  </head>
  <body>
    <button class="app-switcher-toggle" type="button" onclick="toggleAppSwitcher()" aria-label="เปิดเมนูระบบ">☰</button>
    <div id="appSwitcherBackdrop" class="app-switcher-backdrop app-switcher-hidden" onclick="closeAppSwitcher()"></div>
    <nav id="appSwitcherPanel" class="app-switcher-panel app-switcher-hidden" aria-label="เมนูระบบ">
      <div class="app-switcher-title">เลือกใช้งาน</div>
      <a href="./index.html">ทาวน่า</a>
      <a href="./grill.html">เนื้อย่าง</a>
      <a href="./bigc.html">BigC</a>
      <a href="./stock.html">สต็อก</a>
      <a href="./other-expenses.html">ค่าใช้จ่ายอื่นๆ</a>
      <a href="./dashboard.html" class="active">Dashboard (ยังไม่เสร็จ)</a>
    </nav>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-mark">น้ำ</div>
        <div>
          <h1>กำลังโหลดแดชบอร์ด</h1>
          <p>เชื่อมต่อข้อมูลจาก Google Sheets...</p>
        </div>
      </div>
    </div>
    <script>
      function closeAppSwitcher() {
        document.getElementById('appSwitcherBackdrop').classList.add('app-switcher-hidden');
        document.getElementById('appSwitcherPanel').classList.add('app-switcher-hidden');
      }

      function toggleAppSwitcher() {
        document.getElementById('appSwitcherBackdrop').classList.toggle('app-switcher-hidden');
        document.getElementById('appSwitcherPanel').classList.toggle('app-switcher-hidden');
      }
    </script>
    <script src="dashboard-src/app.js" defer></script>
  </body>
</html>
