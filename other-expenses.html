<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1f7a55">
  <title>ค่าใช้จ่ายอื่นๆ</title>
  <style>
    :root {
      --bg: #f6f8f5;
      --surface: #ffffff;
      --surface-strong: #eef7f0;
      --text: #1c2921;
      --muted: #66736b;
      --line: #dbe5dd;
      --primary: #1f7a55;
      --primary-dark: #15563c;
      --primary-soft: #dff2e7;
      --danger: #d64545;
      --warning: #b87916;
      --shadow: 0 12px 32px rgba(18, 45, 32, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: max(14px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      min-height: 44px;
    }

    .app-switcher-toggle {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      z-index: 10032;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 8px 24px rgba(20, 40, 30, 0.16);
      font-size: 1.45rem;
      font-weight: 900;
    }

    .app-switcher-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.18);
      z-index: 10030;
    }

    .app-switcher-panel {
      position: fixed;
      top: calc(max(14px, env(safe-area-inset-top)) + 54px);
      left: 14px;
      width: min(250px, calc(100vw - 28px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
      z-index: 10031;
    }

    .app-switcher-title {
      padding: 8px 10px 10px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 800;
    }

    .app-switcher-panel a {
      display: block;
      padding: 12px 14px;
      border-radius: 7px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
    }

    .app-switcher-panel a.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .app-switcher-panel a + a { margin-top: 4px; }
    .app-switcher-hidden { display: none !important; }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
      padding-top: 58px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.15rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--primary-dark);
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 22px rgba(18, 45, 32, 0.08);
      padding: 10px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(170px, 260px);
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
      outline: none;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 122, 85, 0.14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 7px;
      padding: 7px 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .expense-list {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    .expense-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.4fr) minmax(74px, 0.45fr) minmax(96px, 0.55fr) minmax(130px, 0.8fr) 42px;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .delete-btn {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: #fff0f0;
      color: var(--danger);
      font-weight: 900;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .action-row .left,
    .action-row .right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .message {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.45;
    }

    .message.error { color: var(--danger); }
    .message.warn { color: var(--warning); }
    .message.success { color: var(--primary-dark); }

    @media (max-width: 720px) {
      body { padding-left: 10px; padding-right: 10px; }
      .shell { padding-top: 54px; }
      .topbar {
        display: grid;
        gap: 8px;
      }
      .status-pill { justify-self: start; }
      .control-grid {
        grid-template-columns: 1fr;
      }
      .expense-row {
        grid-template-columns: minmax(58px, 0.7fr) minmax(78px, 0.8fr) minmax(90px, 1fr) 36px;
      }
      .expense-row .item {
        grid-column: 1 / 4;
      }
      .expense-row .quantity { grid-column: 1 / 2; }
      .expense-row .amount { grid-column: 2 / 3; }
      .expense-row .category { grid-column: 3 / 5; }
      .delete-btn {
        width: 36px;
        grid-column: 4 / 5;
        grid-row: 1;
      }
      .action-row,
      .action-row .left,
      .action-row .right,
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <button class="app-switcher-toggle" type="button" onclick="toggleAppSwitcher()" aria-label="เปิดเมนูระบบ">☰</button>
  <div id="appSwitcherBackdrop" class="app-switcher-backdrop app-switcher-hidden" onclick="closeAppSwitcher()"></div>
  <nav id="appSwitcherPanel" class="app-switcher-panel app-switcher-hidden" aria-label="เมนูระบบ">
    <div class="app-switcher-title">เลือกใช้งาน</div>
    <a href="./index.html">ทาวน่า</a>
    <a href="./grill.html">เนื้อย่าง</a>
    <a href="./bigc.html">BigC</a>
    <a href="./stock.html">สต็อก</a>
    <a href="./other-expenses.html" class="active">ค่าใช้จ่ายอื่นๆ</a>
    <a href="./dashboard.html">Dashboard (ยังไม่เสร็จ)</a>
  </nav>

  <main class="shell">
    <div class="topbar">
      <div class="title-block">
        <h1>ค่าใช้จ่ายอื่นๆ</h1>
      </div>
      <div id="saveState" class="status-pill">พร้อมใช้งาน</div>
    </div>

    <section class="panel" aria-label="ฟอร์มบันทึกค่าใช้จ่ายอื่นๆ">
      <div class="control-grid">
        <div class="field">
          <label for="expenseDate">วันที่</label>
          <input id="expenseDate" class="input" type="date" onchange="loadDateData()">
        </div>
      </div>

      <div id="expenseList" class="expense-list"></div>

      <div class="action-row">
        <div class="left">
          <button class="btn btn-secondary" type="button" onclick="addExpenseRow()">เพิ่มรายการ</button>
        </div>
        <div class="right">
          <button class="btn btn-primary" type="button" onclick="saveData()">บันทึก</button>
        </div>
      </div>

      <div id="message" class="message" role="status"></div>
    </section>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLNcIbQzC30EhRAQQM2e7_WQysgepfPnyadJ6D5T5wE_eMhGPU9JKl_teDfPu7he6Z/exec";
    const ADD_CATEGORY_VALUE = "__add_category__";
    let categories = [];

    function closeAppSwitcher() {
      document.getElementById('appSwitcherBackdrop').classList.add('app-switcher-hidden');
      document.getElementById('appSwitcherPanel').classList.add('app-switcher-hidden');
    }

    function toggleAppSwitcher() {
      document.getElementById('appSwitcherBackdrop').classList.toggle('app-switcher-hidden');
      document.getElementById('appSwitcherPanel').classList.toggle('app-switcher-hidden');
    }

    function setMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text || '';
      el.className = 'message' + (type ? ' ' + type : '');
    }

    function setSaveState(text) {
      document.getElementById('saveState').textContent = text;
    }

    function todayKey() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 10);
    }

    async function apiCall(action, data = {}) {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...data })
      });
      const text = await response.text();
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        throw new Error('หลังบ้านตอบกลับผิดปกติ');
      }
      if (parsed.status === 'error') {
        throw new Error(parsed.message || 'บันทึกไม่สำเร็จ');
      }
      return parsed;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function inputValue(value) {
      return value === 0 ? '0' : (value || '');
    }

    function renderCategorySelectOptions(selectedValue = '') {
      const selected = inputValue(selectedValue);
      const categoryOptions = categories.map(category => {
        const isSelected = category === selected ? ' selected' : '';
        return `<option value="${escapeHtml(category)}"${isSelected}>${escapeHtml(category)}</option>`;
      });
      if (selected && !categories.includes(selected)) {
        categoryOptions.unshift(`<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)}</option>`);
      }
      return `
        <option value="">ประเภท</option>
        ${categoryOptions.join('')}
        <option value="${ADD_CATEGORY_VALUE}">+ เพิ่มประเภท</option>
      `;
    }

    function refreshCategorySelects() {
      document.querySelectorAll('select.category').forEach(select => {
        const currentValue = select.value && select.value !== ADD_CATEGORY_VALUE ? select.value : (select.dataset.previous || '');
        select.innerHTML = renderCategorySelectOptions(currentValue);
        select.value = currentValue;
        select.dataset.previous = currentValue;
      });
    }

    function addExpenseRow(row = {}) {
      const list = document.getElementById('expenseList');
      const wrapper = document.createElement('div');
      wrapper.className = 'expense-row';
      wrapper.innerHTML = `
        <input class="input item" type="text" placeholder="รายการ" value="${escapeHtml(inputValue(row.item))}">
        <input class="input quantity" type="number" step="0.01" inputmode="decimal" placeholder="จำนวน" value="${escapeHtml(inputValue(row.quantity))}">
        <input class="input amount" type="number" step="0.01" inputmode="decimal" placeholder="ยอดเงิน" value="${escapeHtml(inputValue(row.amount))}">
        <select class="input category" aria-label="ประเภท" onchange="handleCategoryChange(this)">${renderCategorySelectOptions(row.category)}</select>
        <button class="delete-btn" type="button" aria-label="ลบรายการ" onclick="removeExpenseRow(this)">ลบ</button>
      `;
      list.appendChild(wrapper);
      const select = wrapper.querySelector('select.category');
      select.dataset.previous = select.value || '';
    }

    function removeExpenseRow(button) {
      button.closest('.expense-row').remove();
      if (!document.querySelector('.expense-row')) addExpenseRow();
    }

    function getEnterNavigationFields() {
      return Array.from(document.querySelectorAll(
        '#expenseDate, #expenseList .item, #expenseList .quantity, #expenseList .amount, #expenseList .category'
      ));
    }

    function focusField(field) {
      if (!field) return;
      field.focus();
      if (field.tagName !== 'SELECT' && typeof field.select === 'function') field.select();
    }

    function focusNextField(currentField) {
      const fields = getEnterNavigationFields();
      const currentIndex = fields.indexOf(currentField);
      if (currentIndex < 0) return;

      if (currentIndex === fields.length - 1) {
        addExpenseRow();
        focusField(getEnterNavigationFields()[currentIndex + 1]);
        return;
      }

      focusField(fields[currentIndex + 1]);
    }

    function handleEnterNavigation(event) {
      if (event.key !== 'Enter' || event.isComposing) return;
      if (!event.target.matches('#expenseDate, #expenseList input, #expenseList select')) return;

      event.preventDefault();
      if (event.target.value === ADD_CATEGORY_VALUE) {
        handleCategoryChange(event.target);
        return;
      }

      focusNextField(event.target);
    }

    function collectRows() {
      return Array.from(document.querySelectorAll('.expense-row')).map(row => ({
        item: row.querySelector('.item').value.trim(),
        quantity: row.querySelector('.quantity').value.trim(),
        amount: row.querySelector('.amount').value.trim(),
        category: row.querySelector('.category').value.trim()
      })).filter(row => row.item || row.quantity || row.amount || row.category);
    }

    function validateRows(rows) {
      for (let i = 0; i < rows.length; i += 1) {
        const row = rows[i];
        if (!row.item) return `แถวที่ ${i + 1}: กรุณากรอกรายการ`;
        if (!row.amount) return `แถวที่ ${i + 1}: กรุณากรอกยอดเงิน`;
        if (!row.category) return `แถวที่ ${i + 1}: กรุณาเลือกประเภท`;
      }
      return '';
    }

    async function refreshCategories() {
      setSaveState('กำลังอัปเดต');
      setMessage('');
      try {
        const result = await apiCall('otherExpenseGetCategories');
        categories = result.categories || [];
        refreshCategorySelects();
        setSaveState('พร้อมใช้งาน');
      } catch (err) {
        setSaveState('มีข้อผิดพลาด');
        setMessage(err.message, 'error');
      }
    }

    async function handleCategoryChange(select) {
      if (select.value !== ADD_CATEGORY_VALUE) {
        select.dataset.previous = select.value;
        return;
      }

      const previousValue = select.dataset.previous || '';
      select.value = previousValue;
      const category = (prompt('เพิ่มประเภทใหม่') || '').trim();
      if (!category) {
        return;
      }

      setSaveState('กำลังเพิ่มประเภท');
      try {
        const result = await apiCall('otherExpenseAddCategory', { category });
        categories = result.categories || [];
        refreshCategorySelects();
        select.value = result.category || category;
        select.dataset.previous = select.value;
        setSaveState('พร้อมใช้งาน');
        setMessage(`เพิ่มประเภท "${result.category}" แล้ว`, 'success');
      } catch (err) {
        select.value = previousValue;
        select.dataset.previous = previousValue;
        setSaveState('มีข้อผิดพลาด');
        setMessage(err.message, 'error');
      }
    }

    async function loadDateData() {
      const date = document.getElementById('expenseDate').value;
      if (!date) return;

      setSaveState('กำลังโหลด');
      setMessage('');
      try {
        const result = await apiCall('otherExpenseLoadDate', { date });
        if (result.categories) {
          categories = result.categories;
        }
        document.getElementById('expenseList').innerHTML = '';
        const rows = result.rows || [];
        if (rows.length) {
          rows.forEach(addExpenseRow);
          setMessage(`โหลดข้อมูลวันที่เลือกแล้ว ${rows.length} รายการ`, 'success');
        } else {
          addExpenseRow();
          setMessage('ยังไม่มีข้อมูลของวันที่เลือก', '');
        }
        refreshCategorySelects();
        setSaveState('พร้อมใช้งาน');
      } catch (err) {
        document.getElementById('expenseList').innerHTML = '';
        addExpenseRow();
        setSaveState('มีข้อผิดพลาด');
        setMessage(err.message, 'error');
      }
    }

    async function saveData() {
      const date = document.getElementById('expenseDate').value;
      const rows = collectRows();
      if (!date) {
        setMessage('กรุณาเลือกวันที่', 'warn');
        return;
      }

      const validationError = validateRows(rows);
      if (validationError) {
        setMessage(validationError, 'warn');
        return;
      }

      if (rows.length === 0 && !confirm('ไม่มีรายการในวันนี้ ต้องการบันทึกเพื่อลบข้อมูลวันเดียวกันในชีทใช่ไหม?')) return;

      setSaveState('กำลังบันทึก');
      setMessage('');
      try {
        const result = await apiCall('otherExpenseSubmitDate', { date, rows });
        setSaveState('บันทึกแล้ว');
        setMessage(`บันทึกสำเร็จ ${result.rows || 0} รายการ`, 'success');
      } catch (err) {
        setSaveState('มีข้อผิดพลาด');
        setMessage(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('expenseDate').value = todayKey();
      document.addEventListener('keydown', handleEnterNavigation);
      await refreshCategories();
      await loadDateData();
    });
  </script>
</body>
</html>
